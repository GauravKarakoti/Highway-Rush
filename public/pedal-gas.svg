<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 200" width="100%" height="100%">
  <defs>
    <!-- Brushed Aluminum Surface Gradient -->
    <linearGradient id="metal-base-gas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="25%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="75%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Beveled Edge Gradient -->
    <linearGradient id="metal-edge-gas" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Rubber Tread Gradient -->
    <linearGradient id="rubber-tread" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Chrome Bolt Gradient -->
    <radialGradient id="chrome-bolt-gas" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </radialGradient>

    <!-- Nitro Energy Bar Gradient -->
    <linearGradient id="nitro-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <filter id="drop-shadow-gas" x="-25%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <filter id="inner-shadow-gas">
      <feOffset dx="0" dy="2" />
      <feGaussianBlur stdDeviation="1.5" result="offset-blur" />
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse" />
      <feFlood flood-color="black" flood-opacity="0.8" result="color" />
      <feComposite operator="in" in="color" in2="inverse" result="shadow" />
      <feComposite operator="over" in="shadow" in2="SourceGraphic" />
    </filter>
  </defs>

  <!-- Pedal Arm Connecting to Bulkhead -->
  <path d="M 46,0 L 74,0 L 68,36 L 52,36 Z" fill="#1e293b" stroke="#0f172a" stroke-width="2" />
  <rect x="52" y="10" width="16" height="3" fill="#475569" />
  <rect x="52" y="22" width="16" height="3" fill="#475569" />

  <!-- Main Accelerator Pedal Plate -->
  <g filter="url(#drop-shadow-gas)">
    <!-- Base Outer Curved Metal Plate (Slim, Curved Racing Shape) -->
    <path d="M 24,30 C 24,30 96,28 96,30 C 98,60 102,140 92,185 C 90,192 30,192 28,185 C 18,140 22,60 24,30 Z" fill="url(#metal-edge-gas)" />
    <!-- Beveled Inset Plate -->
    <path d="M 27,33 C 27,33 93,31 93,33 C 95,62 99,138 89,181 C 88,187 32,187 31,181 C 21,138 25,62 27,33 Z" fill="url(#metal-base-gas)" stroke="#ffffff" stroke-width="1.5" />

    <!-- Vertical Anti-Slip Rubber Treads -->
    <rect x="36" y="44" width="8" height="95" rx="3" fill="url(#rubber-tread)" filter="url(#inner-shadow-gas)" />
    <rect x="56" y="44" width="8" height="95" rx="3" fill="url(#rubber-tread)" filter="url(#inner-shadow-gas)" />
    <rect x="76" y="44" width="8" height="95" rx="3" fill="url(#rubber-tread)" filter="url(#inner-shadow-gas)" />

    <!-- Drilled Lightweight Speed Holes -->
    <circle cx="40" cy="154" r="5" fill="#0f172a" stroke="#475569" stroke-width="1.2" />
    <circle cx="60" cy="154" r="5" fill="#0f172a" stroke="#475569" stroke-width="1.2" />
    <circle cx="80" cy="154" r="5" fill="#0f172a" stroke="#475569" stroke-width="1.2" />

    <!-- Center NITRO Accent Badge -->
    <rect x="30" y="168" width="60" height="14" rx="2" fill="url(#nitro-glow)" />
    <text x="60" y="178.5" font-family="'Arial Black', sans-serif" font-weight="900" font-size="8.5" fill="#040814" text-anchor="middle" letter-spacing="1.5">NITRO</text>

    <!-- Chrome Allen Bolts -->
    <circle cx="34" cy="38" r="3.5" fill="url(#chrome-bolt-gas)" stroke="#1e293b" stroke-width="0.8" />
    <circle cx="34" cy="38" r="1.5" fill="#0f172a" />

    <circle cx="86" cy="38" r="3.5" fill="url(#chrome-bolt-gas)" stroke="#1e293b" stroke-width="0.8" />
    <circle cx="86" cy="38" r="1.5" fill="#0f172a" />
  </g>
</svg>

